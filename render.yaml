services:
  - type: web
    name: evergreen-ridge-tech-server
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: CONTACT_TO_EMAIL
        value: naim@evergreenridgetech.com
      - key: ALLOWED_ORIGINS
        value: https://www.evergreenridgetech.com,https://evergreenridgetech.com
